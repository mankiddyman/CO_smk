whitelist_3p_v4: /netscratch/dep_mercier/grp_marques/Aaryan/CO_smk/resources/whitelists/3M-3pgex-may-2023_TRU.txt

# ---------------------------------------------------------------------------
# PER-SPECIES PARAMETERS
# Each section has a `default:` block (sensible starting point for a NEW
# species) plus optional blocks keyed by the `species` column of samples.csv.
# A species block lists only the keys that differ. Resolved by
# param_for(sample_id, section, key) in workflow/Snakefile.
#
# Species blocks are the values ACTUALLY USED for reported results — they are
# pinned deliberately so changing a default cannot silently alter them.
# ---------------------------------------------------------------------------

# Stage 1 — het SNP marker filtering from HiFi
marker_filters:
  _template:
    # TEMPLATE -- never read by param_for(). Copy it when adding a species
    # and decide every value from that species' own data, then stamp it.
    min_dp: 10
    max_dp: 80
    min_qual: 30
    min_alt_ratio: 0.3
    max_alt_ratio: 0.7

  Cuscuta_epithymum:
    _approved: "PINNED 2026-09-21 | produced the reported figures (373 COs, 90 cells, nu 2.40)"
    # PINNED: values behind the reported figures (373 COs, 90 cells, nu=2.40).
    min_dp: 10
    max_dp: 80
    min_qual: 30
    min_alt_ratio: 0.3
    max_alt_ratio: 0.7

  Spondias_tuberosa:
    _approved: "PINNED 2026-09-21 | recorded filter_markers params 2026-08-03: 0.3/0.7/10/150/30"
    min_dp: 10
    min_qual: 30
    min_alt_ratio: 0.3
    max_alt_ratio: 0.7
    # HiFi coverage ~91x (median DP of het SNPs; q1=79 q3=104 p90=117).
    # max_dp=80 sat BELOW the diploid peak and rejected 72% of real het sites,
    # giving 0.13% het — irreconcilable with the 0.62% in the collaborators'
    # manuscript. 150 = above the peak, below the 2x-collapsed-paralog line
    # (~182), on the yield plateau (140->250 gains only 1.3% more markers).
    # Yields 1.47M markers = 0.53% het (86% of the k-mer estimate; the rest is
    # indels + repeat regions a mapping-based SNP-only call cannot see).
    max_dp: 150

  Drosera_binata:
    _approved: "2026-09-15 | docs/binata_marker_audit.md"
    # Audited 2026-09-15. Values IDENTICAL to `default:` -- this block exists so
    # they are binata's OWN, with evidence, rather than Cuscuta's pinned tuning
    # inherited silently by param_for(). Workings: docs/binata_marker_audit.md
    #
    # Sample Dbinata_hap1 / refs/Drosera_binata_hap1 (691.8 Mb, 16 chr).
    # ONE PLANT, TWO MOVIES -- not a pool. m84191_241130_003922_s3 ~74% of depth,
    # m64074_230718_093436 ~26%; ALT reads track depth share in both clean and
    # low-AF classes (74.5/74.0 and 74.1/73.3).
    min_dp: 10
    max_dp: 80
    # Median DP at het SNPs 51 (q1 32, q3 80, p90 126). 80 = 1.6x median, ABOVE
    # the diploid peak. NOT the Spondias failure, where 80 sat BELOW a median of
    # 91. The 24.9% max_dp attrition is the high-depth repeat tail, not the peak.
    min_qual: 30
    # Near-inert: QUAL saturates ~220 for almost every call. A mismapped site
    # genuinely has two alleles present, so the caller is right to be confident.
    # Only depth and ALT ratio separate real from artefact here.
    min_alt_ratio: 0.3
    max_alt_ratio: 0.7
    # Raw AF is bimodal: clean peak at 0.5 plus a large ASYMMETRIC low shelf.
    # Mechanism is reference bias localised to divergent regions -- the reference
    # IS hap1, so where hap2 is too divergent to map its reads are lost, and
    # those are the ALT-carrying reads. Can only push AF down, never up. Hence
    # the shelf ANTI-correlates with depth (47.2% of sites <0.3 at DP 10-25 vs
    # 22.8% above DP 250) and is 3x worse outside exons (32.9% vs 10.3%).
    #
    # Validated against minimap2 asm20 hap1-vs-hap2. Raw calls confirmed by an
    # assembly difference at same position AND alleles, alignable sequence only.
    # The 0.40-0.70 plateau (87.6%) is the alignment's own sensitivity ceiling;
    # est. real divides through by it:
    #     <0.10           62,315   9.1%  ->  10% real
    #     0.10-0.20    1,030,823  14.4%  ->  16%
    #     0.20-0.30    1,055,814  39.1%  ->  45%
    #     0.30-0.40    1,385,057  70.6%  ->  81%
    #     0.40-0.60    3,867,113  87.5%  ->  ceiling
    #     0.60-0.70      820,620  87.6%  ->  ceiling
    #     0.70-0.80      309,868  84.1%  ->  96%
    #     >0.80           99,329  77.6%  ->  89%
    #
    # 0.3 is where the trade flips: 0.20-0.30 buys ~471k real for ~585k artefact
    # (worse than 1:1); 0.30-0.40 is ~1,116k real for ~269k (better than 4:1).
    # Artefacts cluster spatially in divergent sequence, so they give CORRELATED
    # wrong genotypes across cells -- false COs, not noise.
    #
    # 0.7 KEPT, deliberately not raised to 0.8 although 0.70-0.80 is ~96% real:
    # gain is ~260k markers on 10.84M (2.4%) for a species nowhere near
    # marker-limited, and Cuscuta and Spondias both run 0.7. Identical
    # ascertainment across the three species beats 2.4% yield.
    #
    # Result: 10,843,674 markers, 15,662/Mb, median spacing 13 bp, 0 gaps >
    # block_size, 1.2x max/min density across chromosomes, implied het 1.5675%
    # genome-wide (1.68% within alignable sequence).


# STAR alignment params. NOT YET APPLIED to the current Spondias BAM -- setting
# alignIntronMax requires rebuilding the index and realigning 935M reads, which
# invalidates the BAM, cellsnp and everything downstream. Apply at the NEXT
# alignment. Recorded here so the value is version-controlled with its evidence.
#
# alignIntronMax: STAR default is 0 = derived from (2^winBinNbits)*
# winAnchorDistNbins = 589,824 bp, a mammal-scale figure. Measured 2026-08-05 on
# the MAPQ>=20 BAM (2% sample, 539,048 N gaps) vs the Helixer annotation
# (121,873 introns):
#            p50    p99      p99.9      max      >20kb
#   annot    177    2,881    8,249      19,287   0
#   observed 201    3,570    229,194    766,661  1,600 (0.297%)
# The two agree to p99 then diverge 28x. The observed distribution is BIMODAL:
# real introns to ~10kb, a valley, then a separate artefact population from
# ~50kb to the 590kb cap. 20000 sits in the valley, above the largest annotated
# intron, and removes the artefact population at zero cost to real introns.
star:
  _template:
    # TEMPLATE -- never read by param_for(). Copy it when adding a species
    # and decide every value from that species' own data, then stamp it.
    align_intron_max: 20000
    align_mem_mb: 80000     # was hardcoded in starsolo_align until 2026-09-15
    align_runtime: 480      # minutes; was hardcoded until 2026-09-15
    bam_sort_ram: 20000000000   # bytes; hardcoded in starsolo_align until 2026-09-21
    sam_mult_nmax: -1           # STAR's own default; each species sets its own
    sa_index_nbases: 13     # min(14, log2(genome)/2 - 1); 13 suits ~0.3-1 Gb
    sjdb_overhang: 99       # read_length - 1
    index_mem_mb: 64000     # STAR index scales with genome size
    index_runtime: 240

  Drosera_binata:
    _approved: "2026-09-21 | intron cap from binata's own GFF3; sort RAM and multimapper cap from the failed 2026-09-15 run"
    sa_index_nbases: 13     # hap1 0.692 Gb -> formula gives 13
    sjdb_overhang: 99       # R2 measured at 100 bp in the LIBprxtR fastq
    index_mem_mb: 64000     # ~48 GB per Gb of genome, floored at 64 GB
    index_runtime: 240
    # Measured 2026-09-15 from binata's OWN annotation.gff3 (92,954 introns
    # from exon gaps across 15,858 genes; the GFF3 also carries 89,527 explicit
    # intron features, the 3.8% difference being multi-isoform handling):
    #            p50    p99     p99.9    max       >20kb
    #   Spondias 177    2,881   8,249    19,287    0
    #   binata   217    6,204   18,613   158,134   66 (0.0710%)
    # Binata's introns run ~2.3x longer at the upper percentiles, so the
    # Spondias JUSTIFICATION does not transfer even though the value does.
    # There 20000 sat above the largest annotated intron and was free. Here it
    # clips 66 annotated introns in <=66 of 15,858 genes -- a negligible number
    # of LOST reads. Raising toward 158kb to recover them would reopen the
    # artefact window measured on Spondias (1,600 N gaps between ~50kb and the
    # 589,824 bp default cap, 0.297% of gaps), i.e. MISPLACED reads. Lost beats
    # misplaced: a lost read costs one marker observation out of 10.8M markers;
    # a misplaced read puts a wrong allele at a real marker and can be called
    # as a crossover.
    # NOTE: STAR inserts annotated junctions into the index as separate
    # contigs, so reads spanning ANNOTATED junctions may align via the sjdb
    # path largely independent of alignIntronMax, which chiefly constrains
    # NOVEL junctions. If so those 66 cost nothing. Verify post-alignment from
    # SJ.out.tab (column 6 = 1 for annotated).
    align_intron_max: 20000
    # 2.26 B read pairs vs Spondias's 468 M (4.8x; its "935M reads" note counts
    # both mates). Runtime is advisory under --cores; enforced only by a
    # scheduler profile.
    align_mem_mb: 160000
    align_runtime: 1440
    # First alignment (2026-09-15) finished mapping and Solo counting, then died
    # at the sort: "Max memory needed for sorting = 95534054128". 128 GB clears
    # it with headroom, and sam_mult_nmax 1 should cut the need several-fold.
    # That run: 89.6% mapped, 31.5% unique, 58.1% multi, 2.3 TB of _STARtmp.
    # 94% of multimappers land in the collapsed 45S rDNA arrays (chr16 ~19.9 Mb,
    # chr7 ~26.2 Mb); all are discarded at min_mapq 20, so writing them is cost.
    bam_sort_ram: 128000000000
    sam_mult_nmax: 1

  Drosera_paradoxa:
    sa_index_nbases: 14     # hap1 2.174 Gb -> formula gives 14 (the ceiling)
    sjdb_overhang: 99       # R2 is 100 bp
    index_mem_mb: 110000    # 2.17 Gb genome; 64 GB is not enough. Now ALSO
                            # passed to STAR as --limitGenomeGenerateRAM, whose
                            # own default of 31 GB would have failed here.
    index_runtime: 600
    # NOT YET MEASURED. Run the same intron extraction against paradoxa's
    # annotation before trusting this value -- 2.17 Gb over 6 chromosomes is a
    # different scale again, and inheriting a measurement made on another
    # species is the mistake this repo has now made twice (Cuscuta's max_dp on
    # binata; Spondias's intron cap here).
    align_intron_max: 20000
    align_mem_mb: 160000
    align_runtime: 1440
    # Sort requirement not measured yet; binata's figure as a starting point.
    # If STAR dies at the sort it prints the exact number it needs.
    bam_sort_ram: 128000000000
    sam_mult_nmax: 1

  # PINNED to what actually built the existing index. Spondias reads are 90 bp
  # so 89 would be nominally correct, but the index was built at 99 and
  # changing this value would trigger a rebuild, invalidating the BAM, cellsnp
  # and the reported landscape (153 cells, 1740 COs, 1137 cM). The cost of 99
  # is a little wasted index memory and no loss of sensitivity. Revisit only
  # if Spondias is realigned from scratch.
  Spondias_tuberosa:
    _approved: "PINNED 2026-09-21 | genomeParameters.txt + STAR Log.out + recorded star_index 2026-07-10"
    sa_index_nbases: 13   # recorded --genomeSAindexNbases 13
    sjdb_overhang: 99
    # PINNED to the existing BAM. alignIntronMax was NEVER PLUMBED THROUGH
    # until 2026-09-15 -- the value sat in config with its justification while
    # STAR ran at its 589,824 bp default. The reported figures (153 cells,
    # 1,740 COs, 1137 cM) were produced at the DEFAULT, so 589824 is recorded
    # here as fact, not preference. Changing it would invalidate the BAM,
    # cellsnp and the landscape. Revisit only on a full realignment.
    align_intron_max: 589824
    align_mem_mb: 80000
    align_runtime: 480
    # PINNED from Log.out's effective command: --limitBAMsortRAM 20000000000,
    # no --outSAMmultNmax (STAR default -1).
    bam_sort_ram: 20000000000
    sam_mult_nmax: -1

  Cuscuta_epithymum:
    _approved: "PINNED 2026-09-21 | genomeParameters.txt + STAR Log.out, docs/provenance/6303_B_hap1"
    # PINNED 2026-09-21 from the run's own records, not from config. Cuscuta's
    # alignment ran in the older CO_snkmk checkout (conda path in
    # results/starsolo/6303_B_hap1/Log.out) and has NO Snakemake metadata in
    # this repo, so dry-runs cannot verify these values -- only its logs can.
    #   genomeParameters.txt: genomeSAindexNbases 13, sjdbOverhang 99
    #   Log.out effective command: no --alignIntronMax (STAR default, 589,824),
    #   no --outSAMmultNmax (default -1), no --limitBAMsortRAM (default 0)
    # Before this block, Cuscuta inherited default:, which claimed
    # align_intron_max 20000 -- not what produced its published BAM.
    sa_index_nbases: 13
    sjdb_overhang: 99
    align_intron_max: 589824
    sam_mult_nmax: -1
    bam_sort_ram: 0
    index_mem_mb: 64000
    index_runtime: 240
    align_mem_mb: 80000
    align_runtime: 480

# cellsnp-lite read filters. min_mapq is ALSO used by filter_bam_uniq to
# pre-filter the BAM -- the two must stay equal (see that rule's docstring).
cell_snp:
  _template:
    # TEMPLATE -- never read by param_for(). Copy it when adding a species
    # and decide every value from that species' own data, then stamp it.
    min_mapq: 20

  Cuscuta_epithymum:
    _approved: "PINNED 2026-09-21 | cellsnp-lite CMD in its log: --minMAPQ 20"
    min_mapq: 20

  Spondias_tuberosa:
    _approved: "PINNED 2026-09-21 | recorded cell_snp_counting params 2026-08-05: 20"
    min_mapq: 20

# Stage 2 - cell calling (EmptyDrops/knee)
# default_lower: UMI floor below which barcodes are treated as ambient. Was
# hardcoded 300 in the rule until 2026-08-05.
cell_calling:
  _template:
    # TEMPLATE -- never read by param_for(). Copy it when adding a species
    # and decide every value from that species' own data, then stamp it.
    # Swept 2026-08-05 (100/300/500/1000 -> 8919/8497/6285/3819 barcodes called):
    # final result IDENTICAL in all four (140 cells, 1581 COs, 1129 cM). The
    # cell_qc filters (min_total_markers 800, min_per_chrom 30, switch <=0.09)
    # are strictly more stringent than any of these thresholds, so they subsume
    # it -- every qualifying cell is already in the lower=1000 set. The knee is
    # soft (knee 674, inflection 442, no plateau) as expected for dehydrated,
    # transcriptionally quiescent mature pollen, but that softness is
    # inconsequential here.
    default_lower: 300

  Cuscuta_epithymum:
    _approved: "PINNED 2026-09-21 | barcodes_called.tsv identical to the lower300 set"
    default_lower: 300

  Spondias_tuberosa:
    _approved: "PINNED 2026-09-21 | recorded cell_calling params 2026-08-05: 300"
    default_lower: 300

# Stage 3 — cell QC thresholds
cell_qc:
  _template:
    # TEMPLATE -- never read by param_for(). Copy it when adding a species
    # and decide every value from that species' own data, then stamp it.
    # !! ref_low / alt_high are NOT PLUMBED: switch_diagnostics passes neither,
    # !! so switch_diagnostics.R uses its own 0.2 / 0.8 whatever is written
    # !! here. Fix at binata's cell-QC gate, before stamping cell_qc for it.
    # !! Spondias has recorded metadata for switch_diagnostics: run
    # !! --cleanup-metadata on its outputs FIRST, or adding these params
    # !! retriggers select_cells -> co_calling -> the reported landscape.
    ref_low: 0.2            # alt_ratio < this -> REF call (genotype 0)
    alt_high: 0.8           # alt_ratio > this -> ALT call (genotype 1)
    min_total_markers: 2500
    min_per_chrom_markers: 40
    max_switch_rate: 0.09

  Cuscuta_epithymum:
    _approved: "PINNED 2026-09-21 | produced the reported figures (373 COs, 90 cells)"
    # PINNED: reported figures.
    ref_low: 0.2
    alt_high: 0.8
    min_total_markers: 2500
    min_per_chrom_markers: 100
    max_switch_rate: 0.09

  Spondias_tuberosa:
    _approved: "PINNED 2026-09-21 | recorded select_cells params 2026-08-05: 0.12/30/800"
    # Set 2026-08-04 from switch_diagnostics on 1,471,619 markers (max_dp=150).
    # 8,497 cells: median 531 markers/cell, DP mean 1.20 (89.5% single-read),
    # switch-rate distribution bimodal -- noise mode at ~0.26, clean haploid
    # shoulder at 0.02-0.10. Allele ratios peak at 0/1 = genuine haploid signal.
    # (800, 0.09) keeps 179 cells; 92.4% of their 2,864 cell x chromosome slots
    # carry >=40 markers. vs Cuscuta 90 cells x 7 chr = 630 chrom-observations,
    # this gives 2,646 -- more sampling, ~5x coarser per-chromosome density.
    ref_low: 0.2
    alt_high: 0.8
    min_total_markers: 800
    # min_per_chrom_markers swept 2026-08-04 (15/20/25/30/40):
    #   cells 177/170/158/140/110, total map 1091/1102/1111/1129/1165 cM,
    #   chromosomes below the 50 cM obligate-CO floor 2/2/2/1/1.
    # Map length is stable (6.4% across a 2.7x change) while cell count moves
    # 61%, so relaxing buys precision cheaply -- but at <=25 a second
    # chromosome drops below the floor (marker-poor cells count in the
    # denominator without contributing detectable COs). 30 = most cells
    # without a new floor violation.
    min_per_chrom_markers: 30
    # Swept 2026-08-05 (0.05/0.07/0.09/0.12):
    #   cells 105/136/140/153, COs/cell 11.40/11.27/11.29/11.37,
    #   total 1140/1127/1129/1137 cM, chromosomes below 50 cM 3/1/1/0.
    # COs/cell is FLAT across the range -> cells admitted at looser thresholds
    # contribute crossovers at the same rate, i.e. they are not noisier. 0.05 is
    # actively worse (fewer cells, 3 floor violations). 0.12 chosen: most cells,
    # no floor violations. The switch-rate distribution is bimodal (noise mode
    # ~0.26, clean haploid shoulder 0.01-0.10) so 0.12 sits just above the clean
    # population; the flat COs/cell shows this does not admit contamination.
    max_switch_rate: 0.12


# Stage 3d — CO calling (sliding-block)
co_calling:
  _template:
    # TEMPLATE -- never read by param_for(). Copy it when adding a species
    # and decide every value from that species' own data, then stamp it.
    cell_markers: 2500      # keep equal to cell_qc.min_total_markers
    block_size: 2000000     # 2 Mb min block size
    marker_num: 23          # min markers per block
    # Genotype-smoothing thresholds in hapCO_identification.R. These were
    # script defaults (inherited from the Rhynchospora original) and were not
    # exposed until 2026-08-06.
    #  base_af   : neighbourhood consensus (adj=2, i.e. 4 neighbours). If the
    #              neighbour ALT fraction is >1-base_af or <base_af, the marker
    #              is overwritten with the consensus; otherwise its own call is
    #              kept. LOWER = stronger consensus required before overriding.
    #  window_af : second pass. Markers whose neighbourhood fraction falls in
    #              [window_af, 1-window_af] are REVERTED to their raw call,
    #              protecting genuinely ambiguous regions from smoothing.
    #              HIGHER = narrower band = more smoothing retained.
    #  genotype  : INERT at this depth. After both smoothing passes column 8
    #              holds only 0 or 1, so any value in (0,0.5) partitions
    #              identically -- verified 0.1/0.2/0.45 all give 11 COs on a
    #              test cell. Exposed for reportability only.
    # SWEPT 2026-08-06, 3x3 grid base_af {0.2,0.3,0.4} x window_af {0.3,0.4,0.5}:
    #   base_af 0.2 -> 1699 COs, 1110 cM, 3 chromosomes BELOW the 50 cM floor
    #   base_af 0.3 -> 1740 COs, 1137 cM, 0 below floor
    #   base_af 0.4 -> 1737-1747 COs, 1135-1142 cM, 0 below floor
    #   window_af had NO effect at any base_af.
    # window_af is inert because win_af is computed over 4 neighbours and can
    # only be 0/0.25/0.5/0.75/1; the revert band [window_af, 1-window_af]
    # catches exactly the value 0.5 for any window_af in (0.25, 0.5].
    # base_af 0.2 is excluded by the obligate-CO floor. 0.3 vs 0.4 differ by
    # 0.4% in map length with identical median CO interval width (359 kb), so
    # 0.3 retained (script default, satisfies the floor, stable).
    base_af: 0.3
    window_af: 0.4
    genotype: 0.2

  Cuscuta_epithymum:
    _approved: "PINNED 2026-09-21 | co_calling_params.txt 2500/2e6/23; smoothing not passed then, so hapCO's defaults (script unchanged since b23f23b, 2026-04-29)"
    base_af: 0.3   # hapCO default, not passed in May
    window_af: 0.4   # hapCO default, not passed in May
    genotype: 0.2   # hapCO default, not passed in May
    # PINNED: history 8 -> 50 -> 30 -> 23. 23 produced the reported figures
    # (373 COs, nu=2.40). Lower catches more close DCOs but risks noise.
    cell_markers: 2500
    block_size: 2000000
    marker_num: 23

  Spondias_tuberosa:
    _approved: "PINNED 2026-09-21 | recorded co_calling params 2026-08-06: 800/1e6/4/0.3/0.4/0.2"
    base_af: 0.3
    window_af: 0.4
    genotype: 0.2
    # 16 chromosomes ~17 Mb each; median 103 markers/chr in passing cells
    # (~6 markers/Mb). Cuscuta's 2 Mb / 23 markers assumed ~3x this density and
    # would reject most Spondias chromosomes. 3 Mb blocks hold ~18 markers at
    # median density. marker_num swept 2026-08-04: 3/4/5/6/8 give total map
    # 1169/1165/1158/1152/1132 cM -- 3.2% spread over a 2.7x parameter change,
    # so map length is data-driven here, not threshold-driven. 4 chosen mid-range.
    # (block_size IS consequential: 3Mb -> 1Mb moved 549 -> 1165 cM, see above.)
    cell_markers: 800      # must equal cell_qc.min_total_markers
    # block_size 3Mb blanked the terminal 3Mb of every chromosome (a CO needs a
    # supported block BOTH sides): 0 COs called within 3Mb of any chromosome end,
    # hard edge at exactly 3Mb. On 17Mb chromosomes that hid 35% of the sequence,
    # concentrated distally where COs occur -> 15/16 chromosomes fell below the
    # 50 cM obligate-CO floor. 1Mb leaves ~12% blanked at ~10 markers/Mb in the
    # selected cells (median 2809 markers / 16 chr).
    # block_size swept 2026-08-06 (250k/500k/1M/1.5M/2M):
    #   COs 2193/1999/1740/1501/1266, map 1433/1307/1137/981/827 cM,
    #   chromosomes below the 50 cM obligate-CO floor 0/0/0/6/10.
    # NO PLATEAU -- map length rises monotonically as blocks shrink, so the
    # sweep alone cannot select a value. Bounds:
    #  UPPER: >=1.5Mb breaks the obligate-CO floor (6 and 10 chromosomes under
    #    50 cM). One CO per bivalent makes 2 of 4 chromatids recombinant, so
    #    0.5 CO/gamete = 50 cM is a hard physical minimum per chromosome.
    #  LOWER: 250kb blocks hold ~2.5 markers at the observed ~10 markers/Mb,
    #    below the marker_num=4 requirement, so only unusually dense blocks
    #    qualify -> biased sample.
    # 500kb vs 1Mb: 500kb finds 280 extra COs. These were tested and are NOT
    # distinguishable from the 1719 shared calls -- marker support 7948 vs 8054
    # (+/-500kb), interval width 347 vs 365 kb median, p90 1184 vs 1468 kb.
    # They are NOT recovered blind-zone COs (median 2.13 Mb from a chromosome
    # end, only 7.5% within 1Mb of an end) but rather COs in locally
    # marker-poor interior patches that a 1Mb block cannot resolve.
    # 1Mb retained as the conservative choice on marker density alone: ~10
    # markers per block vs a requirement of 4, whereas 500kb gives ~5 -- a
    # margin of one at mean DP 1.20, where 89.5% of genotype calls rest on a
    # single read. REPORT THE SENSITIVITY (1137 cM at 1Mb, 1307 at 500kb,
    # 981 at 1.5Mb); all are lower bounds since CO detection has not saturated.
    block_size: 1000000
    marker_num: 4


# ---------------------------------------------------------------------------
# Global plotting params (genome-agnostic; no per-species blocks)
